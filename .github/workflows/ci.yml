name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npx --yes npm@11 ci
      - run: npm run check
      - run: npm test
      - run: npm run test:assistant-runtime
      - run: npm run test:calendar-oauth
      - run: npm run test:assistant-index-budget
      - run: npm run test:assistant-outgoing
      - run: npm run test:assistant-install
      - run: npm run build
      - run: npm run build:assistant
      - run: npm audit
